[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mano-lab"
version = "0.1.0"
description = "Phase 0 feasibility and security lab for mano-OS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mano-lab = "mano_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
