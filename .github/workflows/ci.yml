name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.14.0
      - name: Compile native approval adapter with strict warnings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libjson-c-dev libsystemd-dev
          cc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=2 native/mano_approve.c $(pkg-config --cflags --libs json-c libsystemd) -lpam -Wl,-z,relro,-z,now -o /tmp/mano-approve
      - run: ruff check .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: git diff --check
      - run: bash -n scripts/*.sh
  security-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install CI-only VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils acl
          if [ -e /dev/kvm ]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
      - name: Run real Debian VM negative and feasibility probes
        env:
          MANO_DISPOSABLE_CI: '1'
        run: bash scripts/run_vm_lab.sh
      - name: Upload real evidence, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase0-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
  merge-gate:
    if: always()
    needs: [quality, security-lab]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every required job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security-lab.result }}
        run: test "$QUALITY" = success && test "$SECURITY" = success
