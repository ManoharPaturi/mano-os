# Prompt-only human session. Agent tasks never receive this runtime or IPC.
set $mod Mod4
output * bg #101827 solid_color
xwayland disable
for_window [app_id="org.mano.Prompt"] fullscreen enable
exec /usr/bin/python3 -m mano_prompt
bindsym $mod+Return exec /usr/bin/python3 -m mano_prompt
# Convenient human recovery terminal; physical provenance is a separate gate.
bindsym $mod+Shift+Escape exec /usr/bin/foot --title "mano recovery" /bin/bash
